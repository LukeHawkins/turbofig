[workspace]
members = ["daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.94"
repository = "https://github.com/LukeHawkins/turbofig"
homepage = "https://github.com/LukeHawkins/turbofig"
description = "Free, always-on bridge that lets Claude Code, Cursor and Copilot drive Figma"
keywords = ["figma", "mcp", "mcp-server", "claude", "design"]
categories = ["development-tools", "command-line-utilities"]
license = "MIT"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
