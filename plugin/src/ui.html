<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbofig</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #status {
        color: #666;
      }
      #profile-row {
        margin-top: 10px;
      }
      #profile-row label {
        display: block;
        margin-bottom: 4px;
        color: #333;
      }
      #profile {
        width: 100%;
        font-size: 13px;
        box-sizing: border-box;
      }
      #customProfile {
        width: 100%;
        font-size: 13px;
        box-sizing: border-box;
        margin-top: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Turbofig</h1>
    <p id="status">Status: connecting</p>
    <div id="profile-row">
      <label for="profile">Taste profile</label>
      <select id="profile">
        <option value="impeccable">Impeccable</option>
        <option value="editorial">Editorial</option>
        <option value="minimal">Minimal</option>
        <option value="none">None</option>
        <option value="custom">Custom</option>
      </select>
      <input id="customProfile" type="text" placeholder="Enter profile id" />
    </div>
    <script>
      (function () {
        var WS_URL = "ws://localhost:18847";
        var statusEl = document.getElementById("status");
        var profileSel = document.getElementById("profile");
        var customInput = document.getElementById("customProfile");

        /** Known profile ids that map to named select options. */
        var KNOWN_PROFILES = ["impeccable", "editorial", "minimal", "none"];

        /** Returns the current profile id from the selector. */
        function getSelectedProfileId() {
          if (profileSel.value === "custom") {
            return customInput.value.trim();
          }
          return profileSel.value;
        }

        /** Posts SET_PROFILE to the main thread with the current selector value. */
        function postSetProfile() {
          parent.postMessage({ pluginMessage: { type: "SET_PROFILE", profileId: getSelectedProfileId() } }, "*");
        }

        profileSel.onchange = function () {
          if (profileSel.value === "custom") {
            /* Show the field and wait for the user to commit a custom id.
               Do not post yet: an empty custom id resolves to impeccable and
               would snap the select off "custom" while the user is typing. */
            customInput.style.display = "block";
            customInput.focus();
            return;
          }
          customInput.style.display = "none";
          postSetProfile();
        };

        /* Commit the custom id on change (blur or Enter), not on each keystroke.
           This stops a mid-typing FILE_INFO echo from reformatting the control. */
        customInput.onchange = function () {
          if (profileSel.value === "custom" && customInput.value.trim() !== "") {
            postSetProfile();
          }
        };

        /** Latest FILE_INFO received from the main thread. Sent to daemon on each connect. */
        var latestFileInfo = null;

        /** Current reconnect attempt count. Reset to 0 on a successful open. */
        var attempt = 0;

        /** Active WebSocket instance. */
        var ws = null;

        function setStatus(text) {
          if (statusEl) statusEl.textContent = "Status: " + text;
        }

        /**
         * Exponential backoff capped at 30s. Mirrors protocol.ts backoffDelayMs.
         * Base 500ms, factor 2.
         */
        function backoffDelayMs(n) {
          return Math.min(500 * Math.pow(2, n < 0 ? 0 : n), 30000);
        }

        function connect() {
          setStatus("connecting");
          ws = new WebSocket(WS_URL);

          ws.onopen = function () {
            attempt = 0;
            setStatus("connected");
            /* Re-identify the file to the daemon on every successful connect. */
            if (latestFileInfo) {
              ws.send(JSON.stringify(latestFileInfo));
            }
          };

          ws.onclose = function () {
            scheduleReconnect();
          };

          ws.onerror = function () {
            /* onclose fires after onerror; let onclose drive the reconnect. */
            setStatus("disconnected");
          };

          /* Forward WS messages to the main thread. */
          ws.onmessage = function (event) {
            var parsed;
            try {
              parsed = JSON.parse(event.data);
            } catch (_) {
              return;
            }
            parent.postMessage({ pluginMessage: parsed }, "*");
          };
        }

        function scheduleReconnect() {
          var delay = backoffDelayMs(attempt);
          attempt += 1;
          setStatus("reconnecting");
          setTimeout(connect, delay);
        }

        /* Forward main-thread messages over the WS. FILE_INFO is stored, not forwarded immediately. */
        window.onmessage = function (event) {
          var msg = event.data && event.data.pluginMessage;
          if (!msg) return;
          if (msg.type === "FILE_INFO") {
            latestFileInfo = msg;
            /* Reflect the current profile in the selector.
               Empty profileId defaults to impeccable (the daemon default). */
            var pid = msg.profileId || "impeccable";
            if (KNOWN_PROFILES.indexOf(pid) !== -1) {
              profileSel.value = pid;
              customInput.style.display = "none";
            } else {
              profileSel.value = "custom";
              customInput.value = msg.profileId;
              customInput.style.display = "block";
            }
            /* If already connected, send FILE_INFO now so it reaches the daemon. */
            if (ws && ws.readyState === 1 /* OPEN */) {
              ws.send(JSON.stringify(msg));
            }
            return;
          }
          /* Relay RESULT and all other main-thread messages over the WS. */
          if (ws && ws.readyState === 1 /* OPEN */) {
            ws.send(JSON.stringify(msg));
          }
        };

        connect();
      })();
    </script>
  </body>
</html>
