<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbofig</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #status {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Turbofig</h1>
    <p id="status">Status: connecting</p>
    <script>
      (function () {
        var WS_URL = "ws://localhost:18847";
        var statusEl = document.getElementById("status");

        function setStatus(text) {
          if (statusEl) statusEl.textContent = "Status: " + text;
        }

        setStatus("connecting");
        var ws = new WebSocket(WS_URL);

        ws.onopen = function () {
          setStatus("connected");
        };

        ws.onclose = function () {
          setStatus("disconnected");
        };

        ws.onerror = function () {
          setStatus("disconnected");
        };

        /* Forward WS messages to the main thread. */
        ws.onmessage = function (event) {
          parent.postMessage({ pluginMessage: event.data }, "*");
        };

        /* Forward main-thread messages over the WS. */
        window.onmessage = function (event) {
          var msg = event.data && event.data.pluginMessage;
          if (msg !== undefined && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(msg));
          }
        };
      })();
    </script>
  </body>
</html>
