<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbofig</title>
    <style>
      /* === DESIGN TOKENS ================================================= */
      :root {
        /* Figma-aware theme tokens: update live when the user switches themes. */
        --bg: var(--figma-color-bg, #ffffff);
        --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
        --bg-brand: var(--figma-color-bg-brand, #0d99ff);
        --text: var(--figma-color-text, #1a1a1a);
        --text-secondary: var(--figma-color-text-secondary, #6b6b6b);
        --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
        --border: var(--figma-color-border, #e6e6e6);
        --c-connected: var(--figma-color-icon-success, #1e6b3a);
        --c-reconnecting: var(--figma-color-icon-warning, #9a4d00);
        --c-offline: var(--figma-color-icon-danger, #b91c1c);

        /* Spacing scale (px): 4 8 12 16 24 32 */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;
        --sp-6: 32px;

        /* Type scale (px): 12 14 16 20 25 31 39 49 61 */
        --fs-xs: 12px;
        --fs-sm: 14px;
        --fs-md: 16px;
        --fs-lg: 20px;

        /* Font stacks */
        --ff-display: "Inter", "Space Grotesk", Arial, sans-serif;
        --ff-body: "Inter", "Helvetica Neue", Arial, sans-serif;
        --ff-mono: "SF Mono", "Fira Code", Consolas, monospace;
      }

      /* === RESET ========================================================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* === BASE ========================================================== */
      body {
        font-family: var(--ff-body);
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        margin: 0;
        padding: var(--sp-4);
      }

      /* === HEADER ======================================================== */
      .panel-header {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding-bottom: var(--sp-2);
        margin-bottom: var(--sp-3);
        border-bottom: 1px solid var(--border);
      }

      .wordmark {
        font-family: var(--ff-display);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--text);
      }

      .header-version {
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* === CONNECTION STATUS ============================================= */
      /* Coloured dot prefix; inherits class from #conn-status. */
      #conn-status {
        font-size: 12px;
        color: var(--text-secondary);
      }

      #conn-status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border);
        margin-right: var(--sp-1);
        vertical-align: middle;
        position: relative;
        top: -1px;
      }

      #conn-status.connecting {
        color: var(--text-secondary);
      }
      #conn-status.connected {
        color: var(--c-connected);
      }
      #conn-status.connected::before {
        background: var(--c-connected);
      }
      #conn-status.reconnecting {
        color: var(--c-reconnecting);
      }
      #conn-status.reconnecting::before {
        background: var(--c-reconnecting);
      }
      #conn-status.offline {
        color: var(--c-offline);
      }
      #conn-status.offline::before {
        background: var(--c-offline);
      }

      /* === STALE WARNING ================================================= */
      /* Hidden by default; shown when daemon and plugin versions differ. */
      .stale-banner {
        font-size: 12px;
        color: #7d4e00;
        background: #fef9c3;
        border-radius: 4px;
        padding: var(--sp-1) var(--sp-2);
        margin-bottom: var(--sp-2);
      }

      /* === META GROUP ==================================================== */
      .meta-section {
        margin-bottom: var(--sp-5);
      }

      /* Two-column grid: label column auto-sized, value fills the rest. */
      .meta-list {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: var(--sp-3);
        row-gap: var(--sp-1);
        margin: 0 0 var(--sp-2);
        padding: 0;
      }

      /* display:contents removes the row div from layout; dt/dd become grid items. */
      .meta-row {
        display: contents;
      }

      .meta-row dt {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        align-self: baseline;
      }

      .meta-row dd {
        font-size: 14px;
        color: var(--text);
        margin: 0;
        min-width: 0;
      }

      /* === CONNECT BUTTON ================================================ */
      .connect-btn {
        display: block;
        width: 100%;
        font-size: 14px;
        font-weight: 500;
        font-family: var(--ff-body);
        padding: var(--sp-2) var(--sp-4);
        background: var(--bg-brand);
        color: var(--text-onbrand);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: var(--sp-4);
      }

      /* === TASTE PROFILE CONTROL ========================================= */
      .control-section {
        margin-bottom: var(--sp-5);
      }

      .control-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        margin-bottom: var(--sp-1);
      }

      #profile,
      #customProfile,
      #port-field {
        width: 100%;
        font-size: 14px;
        font-family: var(--ff-body);
        padding: var(--sp-1) var(--sp-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
      }

      #customProfile {
        margin-top: var(--sp-1);
        display: none;
      }

      /* Validation hint: shown when the port field value is outside 1–65535. */
      .field-hint {
        font-size: 12px;
        color: var(--c-offline);
        margin: var(--sp-1) 0 0;
        display: none;
      }

      /* === ACTIVITY LOG ================================================== */
      .log-section {
        margin-bottom: var(--sp-5);
      }

      /* Reusable label style: 12px uppercase, muted. */
      .section-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        margin: 0 0 var(--sp-1);
      }

      #activity-log {
        height: 80px;
        overflow-y: auto;
        background: var(--bg-secondary);
        border-radius: 4px;
        padding: var(--sp-1) var(--sp-2);
        font-family: var(--ff-mono);
        font-size: 12px;
        color: var(--text);
      }

      .log-entry {
        line-height: 1.6;
      }

      /* === COPY BUTTON =================================================== */
      .copy-btn {
        font-size: 12px;
        font-family: var(--ff-body);
        color: var(--text);
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px var(--sp-2);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* === ADVANCED DISCLOSURE =========================================== */
      details.advanced-section {
        margin-bottom: var(--sp-5);
      }

      details.advanced-section > summary {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        cursor: pointer;
        list-style: none;
        margin-bottom: var(--sp-2);
      }

      details.advanced-section > summary::-webkit-details-marker {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Header: wordmark, version, spacer, connection status in one row. -->
    <header class="panel-header">
      <span class="wordmark">turbofig</span>
      <span class="header-version">v<span id="plugin-version"></span></span>
      <span class="header-spacer" style="flex:1"></span>
      <span id="conn-status">Connecting...</span>
    </header>

    <!-- Stale warning: visible only when daemon and plugin versions differ. -->
    <div id="stale-warning" class="stale-banner" role="alert" style="display:none"></div>

    <!-- File identity and session: grouped tightly by proximity. -->
    <section class="meta-section" aria-label="File and session">
      <dl class="meta-list">
        <div class="meta-row">
          <dt>File</dt>
          <dd style="display:flex;align-items:center;gap:var(--sp-2);">
            <span id="file-line" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">No file</span>
            <button id="copy-filekey" class="copy-btn" type="button" style="display:none">Copy</button>
          </dd>
        </div>
        <div class="meta-row" id="session-row" style="display:none">
          <dt>Session</dt>
          <dd id="session-line"></dd>
        </div>
      </dl>
      <button id="copy-connect" class="connect-btn" type="button" style="display:none">Copy prompt to connect Claude</button>
    </section>

    <!-- Advanced: collapsed by default. Taste, log, and port are rarely changed. -->
    <details class="advanced-section">
      <summary>Advanced</summary>
      <!-- Taste profile: a single control, labelled clearly. -->
      <section class="control-section" aria-label="Taste profile">
        <label class="control-label" for="profile">Taste profile</label>
        <select id="profile">
          <option value="impeccable">Impeccable</option>
          <option value="editorial">Editorial</option>
          <option value="minimal">Minimal</option>
          <option value="none">None</option>
          <option value="custom">Custom</option>
        </select>
        <input id="customProfile" type="text" placeholder="Enter profile id" />
      </section>
      <!-- Activity log: monospace, fixed height, scrollable. -->
      <section class="log-section" aria-label="Activity">
        <p class="section-label">Activity</p>
        <div id="activity-log" role="log" aria-live="polite"></div>
      </section>
      <!-- Daemon port: the WebSocket port the plugin connects to. -->
      <section class="control-section" aria-label="Daemon port">
        <label class="control-label" for="port-field">Daemon port</label>
        <input id="port-field" type="number" min="1" max="65535" value="18847" />
        <p id="port-hint" class="field-hint">Enter a whole number between 1 and 65535.</p>
      </section>
    </details>

    <script>__UI_BUNDLE__</script>
  </body>
</html>
