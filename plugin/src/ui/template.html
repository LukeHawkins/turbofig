<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbofig</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        font-size: 13px;
        color: #111;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .info-row {
        margin: 0 0 6px;
        color: #555;
      }
      .info-row span {
        color: #111;
        font-weight: 500;
      }
      #conn-status.connected {
        color: #1a7f37;
      }
      #conn-status.reconnecting {
        color: #b85c00;
      }
      #conn-status.offline {
        color: #cf222e;
      }
      #pairing-section {
        margin: 10px 0;
        padding: 8px;
        border-radius: 4px;
        background: #f6f8fa;
      }
      #pairing-section h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #555;
        margin: 0 0 4px;
      }
      #pairing-line {
        margin: 0;
        color: #444;
      }
      #pairing-line.paired {
        color: #1a7f37;
      }
      #pairing-line.unpaired {
        color: #6e7781;
      }
      #stale-warning {
        background: #fff8c5;
        border: 1px solid #d4a017;
        border-radius: 4px;
        padding: 5px 8px;
        font-size: 11px;
        color: #7d4e00;
        margin: 0 0 6px;
      }
      #activity-section {
        margin: 10px 0;
      }
      #activity-section h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #555;
        margin: 0 0 4px;
      }
      #activity-log {
        height: 80px;
        overflow-y: auto;
        background: #f6f8fa;
        border-radius: 4px;
        padding: 4px 6px;
        font-family: monospace;
        font-size: 11px;
        color: #444;
      }
      .log-entry {
        line-height: 1.6;
      }
      #profile-row {
        margin-top: 12px;
      }
      #profile-row label {
        display: block;
        margin-bottom: 4px;
        color: #333;
      }
      #profile {
        width: 100%;
        font-size: 13px;
        box-sizing: border-box;
      }
      #customProfile {
        width: 100%;
        font-size: 13px;
        box-sizing: border-box;
        margin-top: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Turbofig</h1>
    <p class="info-row">Plugin: v<span id="plugin-version"></span></p>
    <div id="stale-warning" role="alert" style="display:none"></div>
    <p class="info-row">Status: <span id="conn-status">Connecting...</span></p>
    <p class="info-row">File: <span id="file-line">No file</span></p>
    <p class="info-row">Session: <span id="session-line">No active session</span></p>
    <section id="pairing-section" aria-label="Pairing">
      <h2>Pairing</h2>
      <p id="pairing-line" class="unpaired">Not paired — no Claude session is driving this file yet.</p>
    </section>
    <section id="activity-section" aria-label="Activity">
      <h2>Activity</h2>
      <div id="activity-log" role="log" aria-live="polite"></div>
    </section>
    <div id="profile-row">
      <label for="profile">Taste profile</label>
      <select id="profile">
        <option value="impeccable">Impeccable</option>
        <option value="editorial">Editorial</option>
        <option value="minimal">Minimal</option>
        <option value="none">None</option>
        <option value="custom">Custom</option>
      </select>
      <input id="customProfile" type="text" placeholder="Enter profile id" />
    </div>
    <script>__UI_BUNDLE__</script>
  </body>
</html>
