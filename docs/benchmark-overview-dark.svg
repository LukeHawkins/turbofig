<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>turbofig vs figma-console-mcp, measured side by side</title>
<desc>Four panels comparing turbofig to figma-console-mcp, one run each. Tokens for one design session, a 4-step landing page with a screenshot after each step: turbofig 134,000 tokens, figma-console-mcp 375,000 tokens (2.8 times more). Time for that session: turbofig 2.9 minutes, figma-console-mcp 5.9 minutes (includes approval waits). Tokens for one screenshot of the same frame, default settings: turbofig 1,225 tokens at 1200 pixels, figma-console-mcp 3,264 tokens at 2000 pixels. Approval prompts in 4 small jobs: turbofig 0, figma-console-mcp 6.</desc>
<rect x="0" y="0" width="860" height="400" fill="#1a1a19" />
<text x="20" y="30" font-size="17" font-weight="700" fill="#ffffff">Measured side by side</text>
<text x="20" y="50" font-size="12.5" fill="#c3c2b7">Same prompts, same model (Claude Sonnet 5), one run each. Lower is better.</text>
<rect x="20" y="62" width="10" height="10" rx="2" fill="#3987e5" />
<text x="36" y="71" font-size="12.5" fill="#ffffff">turbofig</text>
<rect x="120" y="62" width="10" height="10" rx="2" fill="#d95926" />
<text x="136" y="71" font-size="12.5" fill="#ffffff">figma-console-mcp</text>
<text x="20" y="110.0" font-size="13" font-weight="600" fill="#ffffff">Tokens for one design session: a 4-step landing page, screenshot after each step</text>
<path d="M 20.0 116.0 H 233.3 A 4 4 0 0 1 237.3 120.0 V 125.0 A 4 4 0 0 1 233.3 129.0 H 20.0 Z" fill="#3987e5" />
<path d="M 20.0 131.0 H 626.0 A 4 4 0 0 1 630.0 135.0 V 140.0 A 4 4 0 0 1 626.0 144.0 H 20.0 Z" fill="#d95926" />
<text x="245.3" y="126.5" font-size="11.5" fill="#c3c2b7">134K</text>
<text x="638.0" y="141.5" font-size="11.5" fill="#c3c2b7">375K (2.8× more)</text>
<text x="20" y="180.0" font-size="13" font-weight="600" fill="#ffffff">Time for that session</text>
<path d="M 20.0 186.0 H 315.8 A 4 4 0 0 1 319.8 190.0 V 195.0 A 4 4 0 0 1 315.8 199.0 H 20.0 Z" fill="#3987e5" />
<path d="M 20.0 201.0 H 626.0 A 4 4 0 0 1 630.0 205.0 V 210.0 A 4 4 0 0 1 626.0 214.0 H 20.0 Z" fill="#d95926" />
<text x="327.8" y="196.5" font-size="11.5" fill="#c3c2b7">2.9 min</text>
<text x="638.0" y="211.5" font-size="11.5" fill="#c3c2b7">5.9 min (includes approval waits)</text>
<text x="20" y="250.0" font-size="13" font-weight="600" fill="#ffffff">Tokens for one screenshot of the same frame, default settings</text>
<path d="M 20.0 256.0 H 244.9 A 4 4 0 0 1 248.9 260.0 V 265.0 A 4 4 0 0 1 244.9 269.0 H 20.0 Z" fill="#3987e5" />
<path d="M 20.0 271.0 H 626.0 A 4 4 0 0 1 630.0 275.0 V 280.0 A 4 4 0 0 1 626.0 284.0 H 20.0 Z" fill="#d95926" />
<text x="256.9" y="266.5" font-size="11.5" fill="#c3c2b7">1,225 (1200 px)</text>
<text x="638.0" y="281.5" font-size="11.5" fill="#c3c2b7">3,264 (2000 px)</text>
<text x="20" y="320.0" font-size="13" font-weight="600" fill="#ffffff">Approval prompts in 4 small jobs</text>
<rect x="20.0" y="326.0" width="0.0" height="13" fill="#3987e5" />
<path d="M 20.0 341.0 H 626.0 A 4 4 0 0 1 630.0 345.0 V 350.0 A 4 4 0 0 1 626.0 354.0 H 20.0 Z" fill="#d95926" />
<text x="28.0" y="336.5" font-size="11.5" fill="#c3c2b7">0</text>
<text x="638.0" y="351.5" font-size="11.5" fill="#c3c2b7">6</text>
<text x="20" y="380.0" font-size="11" fill="#c3c2b7">Session figures leave out time spent recovering from tool failures, on both sides. Details: session-test.md in the benchmark results.</text>
</svg>
