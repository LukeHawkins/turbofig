<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>turbofig vs figma-console-mcp, where the difference comes from</title>
<desc>Three panels comparing turbofig to figma-console-mcp. Tokens across the same 4 jobs, if all tools are loaded (estimate): turbofig about 57,200 tokens total (50,400 for the work, about 6,800 for the tool list), figma-console-mcp about 404,500 tokens total (38,500 for the work, about 366,000 for the tool list). Approval prompts across the same 4 jobs: turbofig 0, figma-console-mcp 6. Ready when your AI starts: turbofig 0.07 seconds, figma-console-mcp 1.9 seconds (29 seconds on a first run).</desc>
<rect x="0" y="0" width="860" height="370" fill="#fcfcfb" />
<text x="20" y="30" font-size="17" font-weight="700" fill="#0b0b0b">Where the difference comes from</text>
<text x="20" y="50" font-size="12.5" fill="#52514e">One Mac, macOS 15, October 2026. Lower is better.</text>
<rect x="20" y="62" width="10" height="10" rx="2" fill="#2a78d6" />
<text x="36" y="71" font-size="12.5" fill="#0b0b0b">turbofig</text>
<rect x="120" y="62" width="10" height="10" rx="2" fill="#eb6834" />
<text x="136" y="71" font-size="12.5" fill="#0b0b0b">figma-console-mcp</text>
<text x="20" y="110.0" font-size="13" font-weight="600" fill="#0b0b0b">Tokens across the same 4 jobs, if all tools are loaded (estimate)</text>
<rect x="20.0" y="116.0" width="80.7" height="13" fill="#2a78d6" />
<path d="M 102.7 116.0 H 109.6 A 4 4 0 0 1 113.6 120.0 V 125.0 A 4 4 0 0 1 109.6 129.0 H 102.7 Z" fill="#9fc2ed" />
<text x="121.6" y="126.5" font-size="11.5" fill="#52514e">~57K</text>
<rect x="20.0" y="131.0" width="61.7" height="13" fill="#eb6834" />
<path d="M 83.7 131.0 H 666.0 A 4 4 0 0 1 670.0 135.0 V 140.0 A 4 4 0 0 1 666.0 144.0 H 83.7 Z" fill="#f6bba4" />
<text x="678.0" y="141.5" font-size="11.5" fill="#52514e">~405K</text>
<rect x="20" y="149" width="9" height="9" rx="1.5" fill="#eb6834" />
<text x="34" y="157.0" font-size="11" fill="#52514e">Solid = the work (measured).</text>
<rect x="210" y="149" width="9" height="9" rx="1.5" fill="#f6bba4" />
<text x="224" y="157.0" font-size="11" fill="#52514e">Light = tool list re-read on each of 10 AI calls (estimate).</text>
<text x="20" y="200.0" font-size="13" font-weight="600" fill="#0b0b0b">Approval prompts in the same 4 jobs</text>
<rect x="20.0" y="206.0" width="0.0" height="13" fill="#2a78d6" />
<path d="M 20.0 221.0 H 666.0 A 4 4 0 0 1 670.0 225.0 V 230.0 A 4 4 0 0 1 666.0 234.0 H 20.0 Z" fill="#eb6834" />
<text x="28.0" y="216.5" font-size="11.5" fill="#52514e">0</text>
<text x="678.0" y="231.5" font-size="11.5" fill="#52514e">6</text>
<text x="20" y="270.0" font-size="13" font-weight="600" fill="#0b0b0b">Ready when your AI starts</text>
<path d="M 20.0 276.0 H 39.9 A 4 4 0 0 1 43.9 280.0 V 285.0 A 4 4 0 0 1 39.9 289.0 H 20.0 Z" fill="#2a78d6" />
<path d="M 20.0 291.0 H 666.0 A 4 4 0 0 1 670.0 295.0 V 300.0 A 4 4 0 0 1 666.0 304.0 H 20.0 Z" fill="#eb6834" />
<text x="51.9" y="286.5" font-size="11.5" fill="#52514e">0.07 s</text>
<text x="678.0" y="301.5" font-size="11.5" fill="#52514e">1.9 s</text>
<text x="20" y="317.0" font-size="11" fill="#52514e">figma-console-mcp: 29 s on a first run</text>
<text x="20" y="350.0" font-size="11" fill="#52514e">Repeated tool lists are cached, so the cost gap is smaller than the token gap. See recount.md in the benchmark results.</text>
</svg>
