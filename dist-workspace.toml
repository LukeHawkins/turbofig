[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). macOS only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# The Homebrew tap to publish the formula to
tap = "LukeHawkins/homebrew-tap"
# Publish the Homebrew formula as part of the release
publish-jobs = ["homebrew"]
# Custom CI steps (install Bun, build the plugin) to run before each build
github-build-setup = "../build-setup.yml"
# release.yml carries one hand-added step (the embedded-plugin check), so dist
# must not fail the plan because the generated file differs.
allow-dirty = ["ci"]

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"

# Pin third-party/first-party GitHub Actions used by the generated release
# workflow to a commit SHA instead of a floating tag.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
