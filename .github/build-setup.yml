# Extra steps that dist runs before each release build (see dist-workspace.toml).
# Kept outside .github/workflows/ so GitHub does not parse it as a workflow.
- name: Install Bun
  uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
  with:
    bun-version: "1.3.10"
- name: Build the Figma plugin
  run: cd plugin && bun install --frozen-lockfile && bun run build
  shell: bash
