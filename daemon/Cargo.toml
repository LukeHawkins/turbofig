[package]
name = "turbofig-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "turbofig-mcp"
path = "src/main.rs"

[lib]
name = "turbofig_mcp"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
