[package]
name = "turbofig-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "turbofig-mcp"
path = "src/main.rs"

[lib]
name = "turbofig_mcp"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
