[package]
name = "turbofig"
version.workspace = true
edition = "2021"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "turbofig"
path = "src/main.rs"

[lib]
name = "turbofig"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "fs", "process", "io-util"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
notify = "6"
base64 = "0.22"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
getrandom = "0.4.3"
libc = "0.2"
semver = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# The menu-bar app (step 2 of the macOS app bundle). macOS-only: `tray-icon`
# (with its `muda` menus) and `tao` (the main-thread event loop) both assume
# a native window/tray system, so neither is even resolved on Linux, which
# keeps `cargo build`/`cargo check` working there with no feature flag
# needed (see `menu_bar` being `cfg(target_os = "macos")` in `lib.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
tao = "0.37"
