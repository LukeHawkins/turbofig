<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turbofig settings</title>
    <style>
      /* Same tokens, type scale, links and footer as about.html
         (daemon/assets/about/about.html): kept as 2 separate literals on
         purpose, since each page is `include_str!`'d standalone (see
         `settings_window.rs`, `about_window.rs`). No script tag anywhere:
         every control is a plain `turbofig-action://` link, intercepted by
         `settings_window::navigation_is_allowed` (see `settings_state.rs`). */
      :root {
        --bg: #ffffff;
        --bg-secondary: #f5f5f5;
        --bg-brand: #0d99ff;
        --text: #1a1a1a;
        --text-secondary: #6b6b6b;
        --text-onbrand: #ffffff;
        --border: #e6e6e6;
        --icon: #333333;

        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;

        --fs-xs: 12px;
        --fs-sm: 14px;
        --fs-lg: 22px;

        --ff-display: "Inter", "Space Grotesk", Arial, sans-serif;
        --ff-body: "Inter", "Helvetica Neue", Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --bg-secondary: #2a2a2a;
          --text: #f2f2f2;
          --text-secondary: #a3a3a3;
          --border: #3a3a3a;
          --icon: #d4d4d4;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--ff-body);
        font-size: var(--fs-sm);
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        margin: 0;
        padding: var(--sp-4);
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        text-align: left;
      }

      /* === STEPS ========================================================== */
      .step {
        display: flex;
        flex-direction: column;
        gap: var(--sp-1);
      }

      .step-title {
        margin: 0;
        font-size: var(--fs-sm);
        font-weight: 600;
      }

      .step-hint {
        margin: 0;
        font-size: var(--fs-xs);
        color: var(--text-secondary);
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        margin-top: var(--sp-1);
      }

      /* === LINKS: plain action links, no buttons with JS behind them ===== */
      .text-link {
        font-size: var(--fs-xs);
        color: var(--text-secondary);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .text-link:hover {
        color: var(--text);
      }

      .muted-line {
        margin: 0;
        font-size: var(--fs-xs);
        color: var(--text-secondary);
      }

      /* === SWITCH: macOS-style, the link itself. Look comes from the
         data-state attribute ("On" is the only on value). ============== */
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-4);
      }

      .switch {
        --track-off: #d1d1d6;
        --track-on: #007aff;
        position: relative;
        flex-shrink: 0;
        width: 38px;
        height: 22px;
        border-radius: 11px;
        background: var(--track-off);
        transition: background 0.15s;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.3),
          0 0 0 0.5px rgba(0, 0, 0, 0.08);
        transition: transform 0.15s;
      }

      .switch[data-state="On"] {
        background: var(--track-on);
      }

      .switch[data-state="On"]::after {
        transform: translateX(16px);
      }

      @media (prefers-color-scheme: dark) {
        .switch {
          --track-off: #48484a;
          --track-on: #0a84ff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .switch,
        .switch::after {
          transition: none;
        }
      }

      /* === FOOTER: lukehawkins.eu and the version ======================== */
      .footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: var(--sp-2);
        border-top: 1px solid var(--border);
        font-size: var(--fs-xs);
        color: var(--text-secondary);
      }

      .links {
        display: flex;
        align-items: center;
        gap: var(--sp-3, 12px);
      }

      .link {
        color: var(--text-secondary);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .link:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="switch-row">
      <div class="step">
        <p class="step-title">Start at login</p>
        <p class="muted-line">Keeps turbofig running after you restart your Mac.</p>
      </div>
      <a class="switch" role="switch" aria-checked="__START_AT_LOGIN_CHECKED__" aria-label="Start at login" data-state="__START_AT_LOGIN_STATE__" href="turbofig-action://__START_AT_LOGIN_TOGGLE_ACTION__"></a>
    </div>

    <div class="switch-row">
      <div class="step">
        <p class="step-title">MCP over HTTP</p>
        <p class="muted-line">Only for MCP clients. The file bridge works either way.</p>
      </div>
      <a class="switch" role="switch" aria-checked="__MCP_HTTP_CHECKED__" aria-label="MCP over HTTP" data-state="__MCP_HTTP_STATE__" href="turbofig-action://__MCP_HTTP_TOGGLE_ACTION__"></a>
    </div>

    <div class="step">
      <p class="step-title">Plugin</p>
      <div class="action-row">
        <a class="text-link" href="turbofig-action://copy-path">Copy path</a>
        <a class="text-link" href="turbofig-action://show-plugin-folder">Show plugin folder</a>
      </div>
    </div>

    <div class="footer">
      <span class="links">
        <a class="link" href="https://lukehawkins.eu">lukehawkins.eu</a>
        <a class="link" href="https://github.com/LukeHawkins/turbofig">GitHub</a>
      </span>
      <span id="version-text">v__VERSION__</span>
    </div>
  </body>
</html>
