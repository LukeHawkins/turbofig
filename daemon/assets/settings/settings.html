<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turbofig settings</title>
    <style>
      /* Same token scheme as about.html (daemon/assets/about/about.html):
         kept as 2 separate literals on purpose, not a shared include, since
         each page is `include_str!`'d standalone (see `settings_window.rs`,
         `about_window.rs`). No script tag anywhere: every control is a plain
         `turbofig-action://` link, intercepted by
         `settings_window::navigation_is_allowed` (see `settings_state.rs`). */
      :root {
        --bg: #ffffff;
        --bg-secondary: #f5f5f5;
        --text: #1a1a1a;
        --text-secondary: #6b6b6b;
        --border: #e6e6e6;
        --icon: #333333;

        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;

        --fs-xs: 12px;
        --fs-sm: 14px;

        --ff-body: "Inter", "Helvetica Neue", Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --bg-secondary: #2a2a2a;
          --text: #f2f2f2;
          --text-secondary: #a3a3a3;
          --border: #3a3a3a;
          --icon: #d4d4d4;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--ff-body);
        font-size: var(--fs-sm);
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        margin: 0;
        padding: var(--sp-4);
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        text-align: left;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-3);
      }

      .row-label {
        font-size: var(--fs-sm);
      }

      .text-link {
        font-size: var(--fs-xs);
        color: var(--text-secondary);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .text-link:hover {
        color: var(--text);
      }

      .btn {
        display: inline-block;
        font-family: var(--ff-body);
        font-size: var(--fs-xs);
        padding: var(--sp-1) var(--sp-3);
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--icon);
        text-align: left;
        text-decoration: none;
      }

      .btn:hover {
        color: var(--text);
      }

      .footer-line {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-top: var(--sp-2);
        border-top: 1px solid var(--border);
        font-size: var(--fs-xs);
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="row-label">Start at login: __START_AT_LOGIN_STATE__</span>
      <a class="text-link" href="turbofig-action://__START_AT_LOGIN_TOGGLE_ACTION__">__START_AT_LOGIN_TOGGLE_LABEL__</a>
    </div>

    <a class="btn" href="turbofig-action://copy-path">Copy plugin manifest path</a>
    <a class="btn" href="turbofig-action://show-plugin-folder">Open plugin folder</a>

    <div class="footer-line">
      <span id="version-text">v__VERSION__</span>
    </div>
  </body>
</html>
